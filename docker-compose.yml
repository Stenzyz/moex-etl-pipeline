x-airflow-common: &airflow-common
  # образ собирает только airflow-init, остальные берут готовый:
  # иначе compose заводит отдельную задачу сборки на каждый сервис
  image: moex-etl-airflow:local
  env_file:
    - .env
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_DB_USER}:${AIRFLOW_DB_PASSWORD}@postgres:5432/${AIRFLOW_DB}
    AIRFLOW__CORE__FERNET_KEY: ${FERNET_KEY}
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET}
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    # для импортов вида from ingest.iss import ...
    PYTHONPATH: /opt/airflow
    # путь внутри контейнера, поэтому задан здесь, а не в .env
    SECURITIES_CSV: /opt/airflow/project_config/securities.csv
  volumes:
    - ./dags:/opt/airflow/dags
    - ./logs:/opt/airflow/logs
    - ./ingest:/opt/airflow/ingest
    - ./spark_jobs:/opt/airflow/spark_jobs
    - ./dq:/opt/airflow/dq
    - ./config:/opt/airflow/project_config
    - ./scripts:/opt/airflow/scripts
    - ./jars:/opt/jars
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on: &airflow-common-depends-on
    postgres:
      condition: service_healthy
    clickhouse:
      condition: service_healthy
    minio:
      condition: service_started
    spark-master:
      condition: service_started

services:

  # только метабазы Airflow и Superset
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${AIRFLOW_DB_USER}
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD}
      POSTGRES_DB: ${AIRFLOW_DB}
      # для docker/postgres-init
      SUPERSET_DB: ${SUPERSET_DB}
      SUPERSET_DB_USER: ${SUPERSET_DB_USER}
      SUPERSET_DB_PASSWORD: ${SUPERSET_DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AIRFLOW_DB_USER} -d ${AIRFLOW_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  clickhouse:
    image: clickhouse/clickhouse-server:26.8
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      # без этого нельзя создать read-only юзера для Superset
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      - ${CLICKHOUSE_HTTP_PORT:-8123}:8123
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user ${CLICKHOUSE_USER} --password ${CLICKHOUSE_PASSWORD} --query 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: always

  # официальные образы MinIO убраны с Docker Hub, это сборка сообщества (pgsty)
  # healthcheck не задан: в образе нет гарантированного curl, готовности ждёт create_bucket.py
  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    ports:
      - ${S3_PORT:-9000}:9000
      - ${MINIO_CONSOLE_PORT:-9001}:9001
    volumes:
      - minio-data:/data
    restart: always

  spark-master:
    image: apache/spark:4.1.3-python3
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    ports:
      - ${SPARK_UI_PORT:-8081}:8080
    restart: always

  # версия Spark должна совпадать с pyspark в образе Airflow, оттуда запускается драйвер
  # (в теге 4.1.3-python3 java 17, как и в образе Airflow)
  spark-worker:
    image: apache/spark:4.1.3-python3
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    environment:
      SPARK_WORKER_CORES: ${SPARK_WORKER_CORES:-4}
      SPARK_WORKER_MEMORY: ${SPARK_WORKER_MEMORY:-6g}
    volumes:
      - ./jars:/opt/jars
    depends_on:
      - spark-master
    restart: always

  airflow-apiserver:
    <<: *airflow-common
    command: api-server
    ports:
      - ${AIRFLOW_PORT:-8080}:8080
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type DagProcessorJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-triggerer:
    <<: *airflow-common
    command: triggerer
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type TriggererJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-init:
    <<: *airflow-common
    build: .
    entrypoint: /bin/bash
    command:
      - -c
      - |
        mkdir -p /opt/airflow/logs
        chown -R "${AIRFLOW_UID:-50000}:0" /opt/airflow/logs
        /entrypoint airflow version
        /entrypoint airflow pools set moex_iss_pool 4 "Параллельные запросы к MOEX ISS"
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_ADMIN_USERNAME}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD}
    user: "0:0"

  superset-init:
    image: moex-etl-superset:local
    build: ./superset
    env_file:
      - .env
    volumes:
      - ./superset/superset_config.py:/app/pythonpath/superset_config.py:ro
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: /bin/bash
    command:
      - -c
      - |
        set -e
        superset db upgrade
        superset fab create-admin \
          --username ${SUPERSET_ADMIN_USERNAME} \
          --firstname Superset \
          --lastname Admin \
          --email admin@example.com \
          --password ${SUPERSET_ADMIN_PASSWORD}
        superset init

  superset:
    image: moex-etl-superset:local
    env_file:
      - .env
    ports:
      - ${SUPERSET_PORT:-8088}:8088
    volumes:
      - ./superset/superset_config.py:/app/pythonpath/superset_config.py:ro
    depends_on:
      superset-init:
        condition: service_completed_successfully
      clickhouse:
        condition: service_healthy
    restart: always

volumes:
  postgres-data:
  clickhouse-data:
  minio-data:
